networks:
  inception_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_user_password:
    file: ../secrets/ftp_user_password.txt

services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: unless-stopped
    networks:
      - inception_network
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file: .env
    secrets:
      - db_root_password
      - db_password

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      - mariadb
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html
    env_file: .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html
  adminer:
    build: ./requirements/Bonus/Adminer
    image: adminer
    container_name: adminer
    restart: unless-stopped
    depends_on:
      - mariadb
    networks:
      - inception_network
  ftp:
    build: requirements/Bonus/FTP
    image: ftp
    container_name: ftp
    restart: unless-stopped
    ports:
      - "21:21"
      - "30000-30010:30000-30010"
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - ftp_user_password
    env_file: .env
  redis:
    build: requirements/Bonus/Redis
    image: redis
    container_name: redis
    restart: unless-stopped
    networks:
      - inception_network
  static_website:
    build: ./requirements/Bonus/website
    image: static_website
    container_name: static_website
    restart: unless-stopped
    networks:
      - inception_network
  netdata:
    build: ./requirements/Bonus/netdata
    image: netdata
    container_name: netdata
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    pid: host
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE

    networks:
      - inception_network